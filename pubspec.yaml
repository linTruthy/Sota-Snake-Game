name: sota_snake_game
description: "A modern snake game with powerups, leaderboards, and daily challenges"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.3+13

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  shared_preferences: ^2.5.4
  games_services: ^5.0.0
  cloud_firestore: ^6.1.1
  audioplayers: ^6.5.1
  firebase_core: ^4.3.0
  confetti: ^0.8.0
  in_app_update: ^4.2.5
 
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    
