name: sota_snake_game
description: "A modern snake game with powerups, leaderboards, and daily challenges"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.3+13

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
 
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  web_socket_channel: ^3.0.1
 # flutter_bluetooth_serial: ^0.4.0
  games_services: ^4.0.2
  confetti: ^0.7.0
  in_app_update: ^4.2.3
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    
